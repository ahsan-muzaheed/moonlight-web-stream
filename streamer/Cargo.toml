[package]
name = "streamer"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
moonlight-common = { workspace = true }
common = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread"] }
webrtc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

# URL-encoding for launch-query passthrough (url_origin/url_path/web_p_*).
form_urlencoded = "1.2"

anyhow = { workspace = true }
thiserror = { workspace = true }

# NEW: dial-out WebSocket transport to the Node server (additive)
serde = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.24"
# Cert strings arrive as JSON text in GetAppList requests and must be parsed
# into pem::Pem (Init gets this for free via serde in common/src/ipc.rs).
pem = { workspace = true }
toml = "0.8"


# Machine hostname for the default streamer id (hostname + PID).
hostname = "0.4"


num = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }

log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true